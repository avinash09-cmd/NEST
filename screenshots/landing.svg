<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="btngrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff08" stroke-width="1"/>
  </pattern>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Navbar -->
  <rect x="0" y="0" width="1280" height="64" fill="#0f172a" opacity="0.9"/>
  <rect x="0" y="63" width="1280" height="1" fill="#ffffff15"/>
  <!-- Logo -->
  <rect x="40" y="20" width="28" height="28" rx="8" fill="#3b82f6"/>
  <text x="54" y="39" font-family="Arial" font-size="14" font-weight="bold" fill="white" text-anchor="middle">N</text>
  <text x="82" y="39" font-family="Arial" font-size="15" font-weight="bold" fill="white">N.E.S.T.</text>
  <!-- Nav buttons -->
  <rect x="1100" y="18" width="80" height="32" rx="8" fill="transparent" stroke="#ffffff30" stroke-width="1"/>
  <text x="1140" y="38" font-family="Arial" font-size="13" fill="#94a3b8" text-anchor="middle">Sign in</text>
  <rect x="1196" y="18" width="88" height="32" rx="8" fill="url(#btngrad)"/>
  <text x="1240" y="38" font-family="Arial" font-size="13" fill="white" text-anchor="middle">Get access</text>

  <!-- Live monitoring badge -->
  <rect x="540" y="100" width="200" height="28" rx="14" fill="#3b82f610" stroke="#3b82f630" stroke-width="1"/>
  <circle cx="556" cy="114" r="5" fill="#60a5fa">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="640" y="119" font-family="Arial" font-size="12" fill="#93c5fd" text-anchor="middle">Live monitoring active</text>

  <!-- Hero heading -->
  <text x="640" y="210" font-family="Arial" font-size="52" font-weight="bold" fill="white" text-anchor="middle">Your neighborhood,</text>
  <text x="640" y="275" font-family="Arial" font-size="52" font-weight="bold" fill="#60a5fa" text-anchor="middle">safer together</text>

  <!-- Subtitle -->
  <text x="640" y="330" font-family="Arial" font-size="18" fill="#94a3b8" text-anchor="middle">Neighborhood Emergency and Safety Tool — AI-powered civic platform</text>
  <text x="640" y="355" font-family="Arial" font-size="18" fill="#94a3b8" text-anchor="middle">for reporting issues, tracking emergencies, and monitoring water quality.</text>

  <!-- CTA Buttons -->
  <rect x="450" y="390" width="190" height="48" rx="10" fill="url(#btngrad)"/>
  <text x="545" y="420" font-family="Arial" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Register as resident</text>
  <rect x="656" y="390" width="174" height="48" rx="10" fill="transparent" stroke="#ffffff30" stroke-width="1.5"/>
  <text x="743" y="420" font-family="Arial" font-size="15" fill="white" text-anchor="middle">Admin sign in</text>

  <!-- Feature cards -->
  <rect x="220" y="480" width="190" height="90" rx="12" fill="#ffffff08" stroke="#ffffff12" stroke-width="1"/>
  <text x="240" y="512" font-family="Arial" font-size="20" fill="#60a5fa">📋</text>
  <text x="240" y="535" font-family="Arial" font-size="13" font-weight="bold" fill="white">Complaint tracking</text>
  <text x="240" y="555" font-family="Arial" font-size="11" fill="#64748b">AI-classified &amp; prioritized</text>

  <rect x="430" y="480" width="190" height="90" rx="12" fill="#ffffff08" stroke="#ffffff12" stroke-width="1"/>
  <text x="450" y="512" font-family="Arial" font-size="20" fill="#f59e0b">🔔</text>
  <text x="450" y="535" font-family="Arial" font-size="13" font-weight="bold" fill="white">Live alerts</text>
  <text x="450" y="555" font-family="Arial" font-size="11" fill="#64748b">Real-time notifications</text>

  <rect x="640" y="480" width="190" height="90" rx="12" fill="#ffffff08" stroke="#ffffff12" stroke-width="1"/>
  <text x="660" y="512" font-family="Arial" font-size="20" fill="#22d3ee">💧</text>
  <text x="660" y="535" font-family="Arial" font-size="13" font-weight="bold" fill="white">Water quality</text>
  <text x="660" y="555" font-family="Arial" font-size="11" fill="#64748b">Zone-by-zone monitoring</text>

  <rect x="850" y="480" width="190" height="90" rx="12" fill="#ffffff08" stroke="#ffffff12" stroke-width="1"/>
  <text x="870" y="512" font-family="Arial" font-size="20" fill="#f87171">🚨</text>
  <text x="870" y="535" font-family="Arial" font-size="13" font-weight="bold" fill="white">Emergency mgmt</text>
  <text x="870" y="555" font-family="Arial" font-size="11" fill="#64748b">Rapid incident response</text>

  <!-- Footer -->
  <text x="640" y="690" font-family="Arial" font-size="12" fill="#334155" text-anchor="middle">© 2026 N.E.S.T. — Neighborhood Emergency and Safety Tool</text>
</svg>
