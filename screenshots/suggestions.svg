<svg width="1280" height="720" xmlns="http://www.w3.org/2000/svg">
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="0" y="0" width="240" height="720" fill="#0f172a"/>
  <rect x="16" y="16" width="32" height="32" rx="8" fill="#3b82f6"/>
  <text x="32" y="37" font-family="Arial" font-size="16" font-weight="bold" fill="white" text-anchor="middle">N</text>
  <text x="58" y="35" font-family="Arial" font-size="13" font-weight="bold" fill="white">N.E.S.T.</text>
  <line x1="0" y1="68" x2="240" y2="68" stroke="#1e293b" stroke-width="1"/>
  <text x="84" y="100" font-family="Arial" font-size="13" fill="#64748b">Dashboard</text>
  <text x="84" y="136" font-family="Arial" font-size="13" fill="#64748b">Complaints</text>
  <rect x="12" y="148" width="216" height="36" rx="8" fill="#f59e0b"/>
  <text x="44" y="171" font-family="Arial" font-size="13" font-weight="bold" fill="white">Suggestions</text>
  <text x="84" y="208" font-family="Arial" font-size="13" fill="#64748b">Alerts</text>
  <text x="84" y="244" font-family="Arial" font-size="13" fill="#64748b">Emergency</text>
  <text x="84" y="280" font-family="Arial" font-size="13" fill="#64748b">Water Quality</text>

  <rect x="240" y="0" width="1040" height="56" fill="white"/>
  <line x1="240" y1="56" x2="1280" y2="56" stroke="#e2e8f0" stroke-width="1"/>
  <text x="260" y="28" font-family="Arial" font-size="18" font-weight="bold" fill="#0f172a">Suggestion Box</text>
  <text x="260" y="44" font-family="Arial" font-size="12" fill="#94a3b8">Anonymous community improvement ideas</text>

  <!-- Submit form -->
  <rect x="260" y="72" width="580" height="350" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Form header -->
  <rect x="280" y="96" width="36" height="36" rx="8" fill="#fef3c7"/>
  <text x="298" y="119" font-family="Arial" font-size="20" text-anchor="middle">💡</text>
  <text x="326" y="108" font-family="Arial" font-size="14" font-weight="bold" fill="#0f172a">Submit a suggestion</text>
  <text x="326" y="124" font-family="Arial" font-size="11" fill="#94a3b8">Fully anonymous — no account info is attached</text>

  <!-- Form fields -->
  <text x="280" y="158" font-family="Arial" font-size="12" font-weight="bold" fill="#374151">Title *</text>
  <rect x="280" y="164" width="540" height="38" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="296" y="187" font-family="Arial" font-size="12" fill="#94a3b8">Brief title for your idea</text>

  <text x="280" y="222" font-family="Arial" font-size="12" font-weight="bold" fill="#374151">Category *</text>
  <rect x="280" y="228" width="540" height="38" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="296" y="251" font-family="Arial" font-size="12" fill="#94a3b8">Select a category ▾</text>

  <text x="280" y="286" font-family="Arial" font-size="12" font-weight="bold" fill="#374151">Your suggestion *</text>
  <rect x="280" y="292" width="540" height="80" rx="8" fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="296" y="314" font-family="Arial" font-size="12" fill="#94a3b8">Describe your suggestion in detail. How would it</text>
  <text x="296" y="332" font-family="Arial" font-size="12" fill="#94a3b8">improve the neighborhood?</text>

  <rect x="280" y="388" width="540" height="18" rx="4" fill="#f59e0b"/>
  <text x="550" y="400" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Submit anonymously</text>

  <!-- Admin review panel -->
  <rect x="856" y="72" width="422" height="622" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <div/>
  <!-- Panel header -->
  <rect x="856" y="72" width="422" height="48" rx="12" fill="#f8fafc"/>
  <line x1="856" y1="120" x2="1278" y2="120" stroke="#e2e8f0" stroke-width="1"/>
  <text x="876" y="100" font-family="Arial" font-size="14" font-weight="bold" fill="#0f172a">All suggestions</text>
  <rect x="1086" y="82" width="50" height="26" rx="6" fill="#3b82f6"/>
  <text x="1111" y="99" font-family="Arial" font-size="11" fill="white" text-anchor="middle">ALL</text>
  <rect x="1148" y="82" width="68" height="26" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1182" y="99" font-family="Arial" font-size="11" fill="#64748b" text-anchor="middle">PENDING</text>
  <rect x="1228" y="82" width="72" height="26" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1264" y="99" font-family="Arial" font-size="11" fill="#64748b" text-anchor="middle">REVIEWED</text>

  <!-- Suggestion items -->
  <!-- Item 1 -->
  <line x1="856" y1="198" x2="1278" y2="198" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="876" y="130" width="86" height="20" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="919" y="143" font-family="Arial" font-size="10" fill="#475569" text-anchor="middle">Park Improvement</text>
  <rect x="974" y="130" width="70" height="20" rx="10" fill="#dcfce7"/>
  <text x="1009" y="143" font-family="Arial" font-size="10" fill="#166534" text-anchor="middle">✓ Reviewed</text>
  <rect x="1056" y="130" width="70" height="20" rx="10" fill="#dcfce7"/>
  <text x="1091" y="143" font-family="Arial" font-size="10" fill="#166534" text-anchor="middle">POSITIVE</text>
  <text x="876" y="166" font-family="Arial" font-size="13" font-weight="bold" fill="#0f172a">Add more park benches in Riverside Park</text>
  <text x="876" y="184" font-family="Arial" font-size="11" fill="#94a3b8">Jul 6, 2026</text>
  <rect x="1148" y="132" width="90" height="24" rx="6" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <text x="1193" y="148" font-family="Arial" font-size="10" fill="#64748b" text-anchor="middle">Unmark</text>

  <!-- Item 2 -->
  <line x1="856" y1="270" x2="1278" y2="270" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="876" y="208" width="72" height="20" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="912" y="221" font-family="Arial" font-size="10" fill="#475569" text-anchor="middle">Road Safety</text>
  <rect x="960" y="208" width="62" height="20" rx="10" fill="#fef3c7"/>
  <text x="991" y="221" font-family="Arial" font-size="10" fill="#92400e" text-anchor="middle">⏰ Pending</text>
  <rect x="1034" y="208" width="62" height="20" rx="10" fill="#f1f5f9"/>
  <text x="1065" y="221" font-family="Arial" font-size="10" fill="#475569" text-anchor="middle">NEUTRAL</text>
  <text x="876" y="244" font-family="Arial" font-size="13" font-weight="bold" fill="#0f172a">Install speed bumps on Cedar Lane</text>
  <text x="876" y="262" font-family="Arial" font-size="11" fill="#94a3b8">Jul 7, 2026</text>
  <rect x="1130" y="210" width="110" height="24" rx="6" fill="#3b82f6"/>
  <text x="1185" y="226" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Mark reviewed</text>

  <!-- Item 3 EXPANDED -->
  <rect x="856" y="270" width="422" height="130" fill="#fafafa"/>
  <line x1="856" y1="400" x2="1278" y2="400" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="876" y="282" width="88" height="20" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="920" y="295" font-family="Arial" font-size="10" fill="#475569" text-anchor="middle">Environment</text>
  <rect x="976" y="282" width="62" height="20" rx="10" fill="#fef3c7"/>
  <text x="1007" y="295" font-family="Arial" font-size="10" fill="#92400e" text-anchor="middle">⏰ Pending</text>
  <text x="876" y="320" font-family="Arial" font-size="13" font-weight="bold" fill="#0f172a">Plant more trees along Main Street</text>
  <text x="876" y="338" font-family="Arial" font-size="11" fill="#94a3b8">Jul 8, 2026</text>
  <text x="876" y="362" font-family="Arial" font-size="12" fill="#475569">The street lacks shade and becomes extremely hot in</text>
  <text x="876" y="378" font-family="Arial" font-size="12" fill="#475569">summer. Native trees would reduce heat and improve walkability.</text>
  <rect x="1130" y="284" width="110" height="24" rx="6" fill="#3b82f6"/>
  <text x="1185" y="300" font-family="Arial" font-size="10" fill="white" text-anchor="middle">Mark reviewed</text>

  <!-- Item 4 -->
  <line x1="856" y1="468" x2="1278" y2="468" stroke="#f1f5f9" stroke-width="1"/>
  <rect x="876" y="412" width="100" height="20" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
  <text x="926" y="425" font-family="Arial" font-size="10" fill="#475569" text-anchor="middle">Community Events</text>
  <rect x="988" y="412" width="70" height="20" rx="10" fill="#dcfce7"/>
  <text x="1023" y="425" font-family="Arial" font-size="10" fill="#166534" text-anchor="middle">✓ Reviewed</text>
  <rect x="1070" y="412" width="70" height="20" rx="10" fill="#dcfce7"/>
  <text x="1105" y="425" font-family="Arial" font-size="10" fill="#166534" text-anchor="middle">POSITIVE</text>
  <text x="876" y="448" font-family="Arial" font-size="13" font-weight="bold" fill="#0f172a">Monthly neighborhood cleanup drive</text>
  <text x="876" y="466" font-family="Arial" font-size="11" fill="#94a3b8">Jul 5, 2026</text>
</svg>
